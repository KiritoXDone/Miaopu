name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Release tag must look like 1.0 or 1.0.1."
            exit 1
          fi

          version_name="$({ sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts || true; } | head -n 1)"
          if [[ -z "$version_name" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi
          if [[ "$version_name" != "$RELEASE_TAG" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match versionName $version_name."
            exit 1
          fi

      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release_notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/miaopu-release-notes.md"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$android_sdk_root" ]]; then
            echo "::error::The GitHub runner does not expose an Android SDK path."
            exit 1
          fi
          sdkmanager_path="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(command -v sdkmanager)"
          fi
          "$sdkmanager_path" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          signing_dir="$RUNNER_TEMP/miaopu-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          chmod 600 "$signing_dir/release.jks"
          echo "MIAOPU_KEYSTORE_PATH=$signing_dir/release.jks" >> "$GITHUB_ENV"
          echo "MIAOPU_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MIAOPU_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MIAOPU_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare release artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"
          mkdir -p dist
          cp "$apk_path" "dist/Miaopu-$RELEASE_TAG.apk"
          cd dist
          sha256sum "Miaopu-$RELEASE_TAG.apk" > "Miaopu-$RELEASE_TAG.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Miaopu-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="dist/Miaopu-$RELEASE_TAG.apk"
          checksum="$apk.sha256"
          notes_file="$RUNNER_TEMP/miaopu-release-notes.md"
          test -s "$notes_file"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk" "$checksum" \
              --verify-tag \
              --notes-file "$notes_file" \
              --title "Miaopu $RELEASE_TAG"
          fi
